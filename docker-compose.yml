services:
  # Backend API (uses Neon cloud database)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predictive-backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    networks:
      - predictive-net
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Message broker for the prediction queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - predictive-net
    restart: unless-stopped

  # Consumes prediction jobs from the queue
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker.run
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - predictive-net
    restart: unless-stopped

  # Queues a prediction job per asset every 5 minutes
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.core.scheduler
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - predictive-net
    restart: unless-stopped
  
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - ./backend/.env
    healthcheck:
      disable: true
    networks:
      - predictive-net
    restart: "no"

  # Frontend (nginx, proxies /api to the backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: predictive-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - predictive-net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  predictive-net:
    driver: bridge